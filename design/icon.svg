<!-- An X in the MyGO!!!!! member colors: Tomori #77BADD, Anon #FFA7B9,
     Rana #00AA9A, Soyo #FFDE88, Taki #A966BA. The letters are drawn by
     design/make-icon.sh, one member color per letter. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="blue" cx="0.14" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#77BADD" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#77BADD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.88" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#FFA7B9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFA7B9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.08" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#FFDE88" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFDE88" stop-opacity="0"/>
