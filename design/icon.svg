      <stop offset="0" stop-color="#77BADD" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFA7B9" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#A966BA" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="x2" x1="0" y1="0" x2="1" y2="0">
