name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the bundled WinSW
        run: go run ./scripts/fetch-winsw
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build the Windows app
        run: go tool mygo build -platform windows/amd64
      - name: Keep the build of a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: build/windows-amd64/
      - name: Upload the installer and archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          shopt -s nullglob
          files=(build/windows-amd64/*.zip build/windows-amd64/*[Ss]etup*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer or archive in build/windows-amd64" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber "${files[@]}"
