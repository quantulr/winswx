name: CI

on:
  push:
    branches: [main, mygo]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the bundled WinSW
        run: go run ./scripts/fetch-winsw
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
